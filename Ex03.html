<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>convert number to array of number</title>
</head>
<body>
    <h2>convert number to array of number</h2>
    <script>
        const digitize = n => [...`${n}`].map(i => parseInt(i));

        console.log(digitize(1234))
    </script>
</body>
</html>
