<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>test equal of object</h2>
    <script>
        // กำหนดฟังก์ชันชื่อ matches ที่รับ arguement จาก object 2 ตัว
        const matches = (obj, source) => Object.keys(source).every(key => obj.hasOwnProperty(key) && obj[key] === source[key]);
        // loop ผ่านแต่ละคีย์ใน object ต้นทาง และจรวจสอบว่าคีย์นั้นอยู่ใน object obj และมีค่าเท่ากันไหม
        console.log(matches({age: 25, hair: 'long', beard: true }, {hair: 'long', beard: true}));
        console.log(matches({hair: 'long', beard: true }, {age: 20,hair: 'short', beard: true}));
    </script>
</body>
</html>
